# DESARROLLO: docker compose up --build
services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"   # API Express
      - "5173:5173"   # Frontend React (Vite)
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - .:/app                        # tu código en vivo dentro del contenedor
      - /app/node_modules             # node_modules viven DENTRO de Docker,
      - /app/backend/node_modules     # así no chocan Windows y Linux
      - /app/frontend/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # scripts SQL (solo corren la 1ª vez)
      - ./db/seed:/seed:ro 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
